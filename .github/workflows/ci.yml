name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Upload validated build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toonlab-build
          path: |
            dist
            worker
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 7
